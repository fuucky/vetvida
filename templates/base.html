<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{%block title %}Clínica Veterinária VetVida{% endblock %} </title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0fff0;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        header h1 {
            color: #006400;
            text-align: center;
            margin-bottom: 10px;
        }
        nav {
            background-color: #add8e6;
            padding: 12px;
            text-align: center;
            margin-bottom: 25px;
        }
        nav a {
            color: black;
            margin: 0 18px;
            text-decoration: none;
            font-weight: bold;
            }
        nav a:hoover {
            text-decoration: underline;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 15px;
            background-color: #add8e6;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1> Clinica Veterinaria VetVida </h1>
        </header>

        <nav>
            <a href="/">Home</a>
            <a href="/sobre">Sobre</a>
            <a href="/servicos">Serviços</a>
            <a href="/contato">Contato</a>
        </nav>

        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <p>Ⓒ 2026 Clínica Veterinária VetVida.</p>
    </footer>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/seulogin.css') }}">
</body>
</html>
